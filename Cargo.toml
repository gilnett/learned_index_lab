[package]
name = "learned-index"
version = "0.2.0"
edition = "2024"
authors = ["Gilnett"]
description = "High-performance Piecewise Geometric Model (PGM) learned index implementation in pure Rust with strict epsilon error guarantees."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/gilnett/learned_index_lab"
homepage = "https://github.com/gilnett/learned_index_lab"
keywords = ["learned-index", "pgm-index", "b-tree", "database", "data-structures"]
categories = ["data-structures", "database-implementations", "algorithms"]

[lib]
name = "learned_index"
path = "src/lib.rs"

[[bin]]
name = "learned_index"
path = "src/main.rs"

[dependencies]
